<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📋 Smart Task Manager</h1>
            <button class="theme-toggle" id="themeToggle"> Dark Mode</button>
        </header>
        
        <section class="task-input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Enter a new task..."
                    autocomplete="off"
                >
                <select id="prioritySelect">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <input type="date" id="dueDateInput">
                <button class="add-btn" id="addTaskBtn">Add Task</button>
            </div>
            <div class="error-message" id="errorMessage">Please enter a task title!</div>
        </section>
        
        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">All Tasks</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
            <button class="filter-btn" data-filter="medium">Medium Priority</button>
            <button class="filter-btn" data-filter="low">Low Priority</button>
            <button class="filter-btn" data-filter="today">Due Today</button>
        </section>
        
        <section class="tasks-container" id="tasksContainer">
        </section>
    </div>

    <script src="script.js"></script>   
</body>

</html>
